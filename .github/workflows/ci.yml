name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  # ── 2. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: test-key-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        # Uses requirements-ci.txt — no torch/sentence-transformers.
        # All embedding and LLM calls are mocked in tests.
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── 3. Docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the API image using a minimal CI Dockerfile that
      # avoids the 700 MB torch download — just verifies the image structure.
      - name: Build API image (CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: false
          tags: mudramitra-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: false
          tags: mudramitra-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
